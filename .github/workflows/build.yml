name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\vcpkg
      # built packages are kept in a folder that GitHub saves between runs
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Make the package cache folder
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\vcpkg-cache" | Out-Null

      - name: Keep built packages between runs
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        run: cmake --preset windows

      - name: Build
        run: cmake --build --preset release

      - name: Test the integrations
        run: python integrations/test_osc_min.py

      - name: Upload RICO
        uses: actions/upload-artifact@v5
        with:
          name: RICO-windows
          path: build/RICO/
